[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    --verbose
    --ignore=tests/test_conftest.py
    --cov=app
    --cov-report=term-missing
    --cov-report=html
    --cov-report=xml
    --cov-fail-under=70
    --disable-warnings
    --ignore=tests/test_pool.py
    --ignore=tests/test_validation.py